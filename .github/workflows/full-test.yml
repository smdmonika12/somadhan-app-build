name: Full App Test (APK build + backend feature tests)

on:
  push:
    branches: [ main, develop ]
  pull_request:
  workflow_dispatch: {}

jobs:
  # ---------------------------------------------------------------------
  # JOB 0: Duplicate/ambiguous RPC-overload scanner (Step 11). Pure text
  # scan over supabase/migrations/*.sql — no Postgres service needed, so
  # this is the cheapest/fastest check and runs first. It only DETECTS
  # ambiguous overloads (PGRST203 risk in PostgREST's HTTP/JSON RPC
  # layer); it never writes/edits any migration (rule #1).
  #
  # 2026-09-21 update (Step 12.12): the 7 previously-known-live ambiguous
  # overloads (admin_adjust_balance, admin_notify_user, admin_set_banned,
  # admin_set_restricted, create_notification, log_admin_action,
  # submit_reputation_event) are now resolved — their old signatures were
  # explicitly DROPped (step12_9 migrations), so the scanner now reports
  # them as HISTORICAL, not STILL-LIVE. Two functions
  # (request_wallet_deposit, user_confirm_extra_amount) remain in an
  # intentional transitional two-signature state (12.8b/12.8c guard
  # rollout, old APK still supported) — these are now allowlisted inside
  # scan_duplicate_overloads.sh itself (ALLOWLIST_NAMES) rather than at
  # the workflow level, so the scanner's own exit code is 0 with no
  # remaining unexplained ambiguity. continue-on-error is therefore
  # removed: this job is now a real blocking gate. If it ever fails
  # again, that means a genuinely new/unexplained ambiguous overload was
  # introduced (see "KNOWN AMBIGUOUS OVERLOAD" in
  # CI_TEST_SUITE_PROGRESS.md and ALLOWLIST_NAMES in
  # scan_duplicate_overloads.sh).
  # ---------------------------------------------------------------------
  rpc-overload-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Self-test the scanner itself (fixture-based, no DB needed)
        run: |
          chmod +x scripts/selftest_scan_duplicate_overloads.sh
          ./scripts/selftest_scan_duplicate_overloads.sh

      - name: Scan migrations for duplicate/ambiguous RPC overloads
        id: scan
        run: |
          chmod +x scripts/scan_duplicate_overloads.sh
          ./scripts/scan_duplicate_overloads.sh | tee overload-scan-output.txt

      - name: Add scan result to job summary
        if: always()
        run: |
          {
            echo "## RPC duplicate/ambiguous-overload scan"
            if [ "${{ steps.scan.outcome }}" = "failure" ]; then
              echo "⚠️ **Non-blocking finding** — one or more functions have ambiguous overloads. See details in CI_TEST_SUITE_PROGRESS.md (\"KNOWN AMBIGUOUS OVERLOAD\") and the log below."
            else
              echo "✅ No duplicate/ambiguous argument-signatures found."
            fi
            echo ""
            echo '```'
            cat overload-scan-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scan output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpc-overload-scan-output
          path: overload-scan-output.txt

  # ---------------------------------------------------------------------
  # JOB 1: Build the APK (debug build, no signing needed for testing)
  # ---------------------------------------------------------------------
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Write .env (test/staging secrets only — never production)
        run: |
          echo "SUPABASE_URL=${{ secrets.STAGING_SUPABASE_URL }}" >> .env
          echo "SUPABASE_ANON_KEY=${{ secrets.STAGING_SUPABASE_ANON_KEY }}" >> .env

      - name: Grant execute to gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Run local (JVM) unit tests
        run: ./gradlew test --stacktrace

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/

  # ---------------------------------------------------------------------
  # JOB 2: Run the FULL backend feature test suite against a disposable
  # Postgres database (same schema as Supabase, seeded with your
  # migrations). No real Supabase project, no real money — every run
  # starts from a clean database.
  # ---------------------------------------------------------------------
  backend-feature-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: supabase/postgres:15.1.0.117
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install psql + pgTAP
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE EXTENSION IF NOT EXISTS pgtap;"

      # (2026-09-19 fix) আগে migration আগে আর stub পরে (run_tests.sh-এ) apply হতো — কিন্তু ৮টা
      # migration এমন টেবিলে ALTER/TRIGGER করে যেগুলোর CREATE TABLE কোনো migration-এই নেই
      # (users, transactions, bids, escrows, notifications, …; শুধু stub বানায়) — তাই migration
      # ধাপেই fail করত। এখন stub আগে, তারপর migration।
      - name: Apply schema stubs (inferred base tables, rule 6) + CI pre-migration fixups
        run: |
          for f in $(ls supabase/tests/*_schema_stub.sql | sort); do
            echo ">> stub $f"
            PGPASSWORD=postgres psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -f "$f"
          done
          echo ">> scripts/ci_pre_migration_fixups.sql"
          PGPASSWORD=postgres psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -f scripts/ci_pre_migration_fixups.sql

      # সব migration চালানো হয় (একটা fail করলেও থামে না), শেষে ব্যর্থ ফাইলের পুরো তালিকা দেখিয়ে
      # step fail করে — যাতে এক রানেই সব সমস্যা দেখা যায়, একটা একটা করে না।
      - name: Apply all migrations (schema + RPC functions)
        run: |
          failed=()
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo ">> applying $f"
            if ! PGPASSWORD=postgres psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f "$f"; then
              failed+=("$f")
            fi
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "‼️ ${#failed[@]} migration file(s) failed to apply:"
            printf '  - %s\n' "${failed[@]}"
            exit 1
          fi

      - name: Self-test the test-runner scripts (no DB needed)
        if: ${{ !cancelled() }}
        run: |
          chmod +x scripts/selftest_test_runner.sh
          ./scripts/selftest_test_runner.sh

      - name: Run full feature test suite (pgTAP)
        if: ${{ !cancelled() }}
        run: |
          # GitHub-এর ডিফল্ট `run:` shell হলো `bash -e {0}` — pipefail ছাড়া। pipefail না থাকলে
          # `run_tests.sh | tee` পাইপলাইনের exit code হয় `tee`-র (সবসময় 0), ফলে run_tests.sh
          # fail করলেও এই step সবুজ থাকত। (2026-09-19 fix)
          set -o pipefail
          chmod +x scripts/run_tests.sh
          ./scripts/run_tests.sh | tee test_output.txt

      - name: Generate pass/fail report
        if: always()
        run: |
          chmod +x scripts/generate_report.sh
          ./scripts/generate_report.sh test_output.txt > feature-test-report.md
          cat feature-test-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload feature test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feature-test-report
          path: feature-test-report.md

  # ---------------------------------------------------------------------
  # JOB 3 (Step 17.3): Supabase Edge Function coverage — Deno runtime,
  # completely separate layer from JOB 1 (Kotlin/JVM) and JOB 2 (SQL/
  # pgTAP). Deliberately its own top-level job (not merged into either of
  # the above) so a failure here immediately shows "Deno/Edge Function
  # layer" rather than being buried inside an unrelated job's log — this
  # was Step 17.3's own explicit requirement (see CI_TEST_SUITE_PROGRESS.md
  # "Step 17.3" section).
  #
  # supabase/functions/admin-reset-user-password/index.ts never touches
  # Postgres directly (only Supabase's HTTP auth/rest API via supabase-js),
  # so — unlike JOB 2 — this job needs no Postgres service at all. Every
  # supabase-js network call is mocked at the globalThis.fetch level
  # inside supabase/tests/deno/_edge_function_test_helpers.ts (rule #2:
  # no real/staging Supabase project is ever touched here).
  #
  # ⚠️ Known, documented limitation (rule #6 / Step 17.1 finding, still
  # unresolved): index.ts calls `rpc("is_admin", { uid })` but the only
  # other guess at this function's signature in this repo (the Step 1
  # pgTAP stub) uses parameter name "p_user_id" — the two are mutually
  # inconsistent, so the *real* live is_admin() signature is unverified.
  # These Deno tests therefore verify index.ts's own client-side
  # error-handling logic (401/403/200/400 branching), not the real
  # database function's behavior. See CI_TEST_SUITE_PROGRESS.md ("Step
  # 17.1 সম্পূর্ণ") for the full writeup.
  # ---------------------------------------------------------------------
  edge-function-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Edge Function (Deno) test suite
        run: |
          deno test --allow-net --allow-env --allow-read supabase/tests/deno/
