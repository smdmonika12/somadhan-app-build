name: Full App Test (APK build + backend feature tests)

on:
  push:
    branches: [ main, develop ]
  pull_request:
  workflow_dispatch: {}

jobs:
  rpc-overload-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Self-test the scanner itself (fixture-based, no DB needed)
        run: |
          chmod +x scripts/selftest_scan_duplicate_overloads.sh
          ./scripts/selftest_scan_duplicate_overloads.sh

      - name: Scan migrations for duplicate/ambiguous RPC overloads
        id: scan
        run: |
          chmod +x scripts/scan_duplicate_overloads.sh
          ./scripts/scan_duplicate_overloads.sh | tee overload-scan-output.txt

      - name: Add scan result to job summary
        if: always()
        run: |
          {
            echo "## RPC duplicate/ambiguous-overload scan"
            if [ "${{ steps.scan.outcome }}" = "failure" ]; then
              echo "⚠️ **Non-blocking finding** — one or more functions have ambiguous overloads. See details in CI_TEST_SUITE_PROGRESS.md (\"KNOWN AMBIGUOUS OVERLOAD\") and the log below."
            else
              echo "✅ No duplicate/ambiguous argument-signatures found."
            fi
            echo ""
            echo '```'
            cat overload-scan-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scan output
        uses: actions/upload-artifact@v4
        with:
          name: rpc-overload-scan-output
          path: overload-scan-output.txt

  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Write .env (test/staging secrets only — never production)
        run: |
          echo "SUPABASE_URL=${{ secrets.STAGING_SUPABASE_URL }}" >> .env
          echo "SUPABASE_ANON_KEY=${{ secrets.STAGING_SUPABASE_ANON_KEY }}" >> .env

      - name: Grant execute to gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Run local (JVM) unit tests
        run: ./gradlew test --stacktrace

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/

  backend-feature-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: supabase/postgres:15.1.0.117
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install psql + pgTAP
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE EXTENSION IF NOT EXISTS pgtap;"

      - name: Apply schema stubs (inferred base tables, rule 6) + CI pre-migration fixups
        run: |
          for f in $(ls supabase/tests/*_schema_stub.sql | sort); do
            echo ">> stub $f"
            PGPASSWORD=postgres psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -f "$f"
          done
          echo ">> scripts/ci_pre_migration_fixups.sql"
          PGPASSWORD=postgres psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -f scripts/ci_pre_migration_fixups.sql

      - name: Apply all migrations (schema + RPC functions)
        run: |
          failed=()
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo ">> applying $f"
            if ! PGPASSWORD=postgres psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f "$f"; then
              failed+=("$f")
            fi
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "‼️ ${#failed[@]} migration file(s) failed to apply:"
            printf '  - %s\n' "${failed[@]}"
            exit 1
          fi

      - name: Self-test the test-runner scripts (no DB needed)
        if: ${{ !cancelled() }}
        run: |
          chmod +x scripts/selftest_test_runner.sh
          ./scripts/selftest_test_runner.sh

      - name: Run full feature test suite (pgTAP)
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          chmod +x scripts/run_tests.sh
          ./scripts/run_tests.sh | tee test_output.txt

      - name: Generate pass/fail report
        if: always()
        run: |
          chmod +x scripts/generate_report.sh
          ./scripts/generate_report.sh test_output.txt > feature-test-report.md
          cat feature-test-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload feature test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feature-test-report
          path: feature-test-report.md

  edge-function-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Edge Function (Deno) test suite
        run: |
          deno test --allow-net --allow-env --allow-read supabase/tests/deno/
